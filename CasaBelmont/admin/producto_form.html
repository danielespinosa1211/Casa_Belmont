<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Producto | Casa Belmont</title>
    <link rel="icon" href="../assets/img/logo/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
</head>

<body data-base="../" data-admin="producto-form" data-menu="productos">

<div class="dashboard">
    <!-- El menú lateral se inserta con admin.js -->
    <main class="contenido">

        <h1 id="titulo-form">Agregar Producto</h1>
        <br>
        <div class="contenedor-formulario">
            <form id="form-producto">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="categoria">Categoría</label>
                <select id="categoria" name="categoria" required></select>

                <label for="precio">Precio</label>
                <input type="number" id="precio" name="precio" min="0" step="1000" required>

                <label for="descripcion">Descripción</label>
                <textarea id="descripcion" name="descripcion" rows="6" required></textarea>

                <label for="imagen" id="label-imagen">Imagen</label>
                <input type="file" id="imagen" name="imagen" accept="image/*" required>
                <img id="vista-previa" class="vista-previa" alt="Vista previa de la imagen">

                <label class="check"><input type="checkbox" name="destacado"> ⭐ Producto destacado</label>
                <label class="check"><input type="checkbox" name="oferta"> 🔥 Producto en oferta</label>

                <div class="acciones-form">
                    <button type="submit" id="btn-guardar">Guardar Producto</button>
                    <a href="productos.html" class="btn-cancelar">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</div>

    <script src="../assets/js/db.js"></script>
    <script src="../assets/js/admin.js"></script>
</body>
</html>
