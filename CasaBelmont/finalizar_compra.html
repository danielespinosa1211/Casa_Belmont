<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar compra | Casa Belmont</title>
    <meta name="description" content="Casa Belmont - Muebles que inspiran hogares">
    <link rel="icon" href="assets/img/logo/logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/estilos.css">
</head>

<body data-pagina="finalizar">

<main class="checkout-container">
        <div class="checkout-card">
            <h1>Finalizar compra</h1>
            <p class="checkout-subtitulo">Completa tus datos para recibir tus muebles</p>

            <form id="form-checkout">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej: Carlos Pérez" required>

                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono" placeholder="Ej: 3001234567" required>

                <label for="direccion">Dirección de entrega</label>
                <textarea id="direccion" name="direccion" placeholder="Ej: Calle 10 #20-30, Villavicencio" required></textarea>

                <button type="submit">Confirmar pedido <i class="fa-solid fa-cart-shopping"></i></button>
            </form>
        </div>

        <aside class="checkout-card">
            <h2>Tu pedido</h2>
            <ul class="resumen-lista" id="resumen-pedido"></ul>
        </aside>
    </main>

    <!-- JavaScript: el encabezado y el pie se insertan con layout.js -->
    <script src="assets/js/db.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/tienda.js"></script>
</body>
</html>
