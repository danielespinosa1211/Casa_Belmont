<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Casa Belmont</title>
    <meta name="description" content="Casa Belmont - Muebles que inspiran hogares">
    <link rel="icon" href="assets/img/logo/logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/estilos.css">
</head>

<body data-pagina="login">

<main class="login-admin">
        <div class="form-login">
            <h1>Casa Belmont</h1>
            <h2>Iniciar Sesión</h2>

            <div id="mensaje"></div>

            <form id="form-login">
                <input type="email" name="correo" placeholder="Correo electrónico" autocomplete="email" required>
                <input type="password" name="password" placeholder="Contraseña" autocomplete="current-password" required>
                <button type="submit">Ingresar</button>
            </form>

            <p class="pie-form">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
        </div>
    </main>

    <!-- JavaScript: el encabezado y el pie se insertan con layout.js -->
    <script src="assets/js/db.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/tienda.js"></script>
</body>
</html>
